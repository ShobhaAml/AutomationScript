name: Unknown user sees an error
tcp:
  User: nobody
  Password: sample-only
modules:
  Login:
    Username: "#username"
    Password: "#password"
    Sign in: "#sign-in"
    Error: "#login-error"
steps:
  - action: Open
  - module: Login
    control: Username
    action: Input
    value: "{CP[User]}"
  - module: Login
    control: Password
    action: Input
    value: "{CP[Password]}"
  - module: Login
    control: Sign in
    action: Input
    value: "{CLICK}"
  - module: Login
    control: Error
    action: WaitOn
    value: Unknown user
  - module: Login
    control: Error
    action: Verify
    value: Unknown user
