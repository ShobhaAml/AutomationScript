# Practical 2. Finish this TestCase, then run it.
# The sample shop shows a message when the user does not exist.
# Replace the Verify value with the message you expect.
# Password stays in tcp. Do not type it on the step.
name: Unknown user sees an error
tcp:
  User: nobody
  Password: sample-only
modules:
  Login:
    Username: "#username"
    Password: "#password"
    Sign in: "#sign-in"
    Error: "#login-error"
steps:
  - action: Open
  - module: Login
    control: Username
    action: Input
    value: "{CP[User]}"
  - module: Login
    control: Password
    action: Input
    value: "{CP[Password]}"
  - module: Login
    control: Sign in
    action: Input
    value: "{CLICK}"
  - module: Login
    control: Error
    action: WaitOn
    value: REPLACE_WITH_THE_MESSAGE
  - module: Login
    control: Error
    action: Verify
    value: REPLACE_WITH_THE_MESSAGE
