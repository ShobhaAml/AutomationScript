name: Returning customer is not offered another trial
tcp:
  User: returning
  Password: sample-only
modules:
  Login:
    Username: "#username"
    Password: "#password"
    Sign in: "#sign-in"
  PlanPicker:
    DueToday: "#due-today"
steps:
  - action: Open
  - module: Login
    control: Username
    action: Input
    value: "{CP[User]}"
  - module: Login
    control: Password
    action: Input
    value: "{CP[Password]}"
  - module: Login
    control: Sign in
    action: Input
    value: "{CLICK}"
  - module: PlanPicker
    control: DueToday
    action: WaitOn
    value: Due today
  - module: PlanPicker
    control: DueToday
    action: Verify
    value: Due today
